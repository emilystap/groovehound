# Groovehound with Docker Compose: `docker compose up -d`.
# Replace the /path/to/... host paths with your own.
services:
  groovehound:
    image: ghcr.io/emilystap/groovehound:latest
    container_name: groovehound
    restart: unless-stopped
    user: "568:568" # needs write access to /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    volumes:
      # SQLite database (wishlist, follows, cached MusicBrainz responses). Back this up.
      - /path/to/groovehound/data:/data
      # Optional: a config.toml instead of the environment variables below.
      # - /path/to/groovehound/config:/config:ro
      # Optional: your music library, read-only, to know what you already have
      # - /path/to/music:/music:ro
    environment:
      # Your time zone (an IANA name), for the dates shown in the UI; stored times are UTC
      TZ: Etc/UTC
      # Required for anything that calls MusicBrainz or ListenBrainz: how they can reach you
      GROOVEHOUND_CONTACT: "you@example.com"
      # Optional: personal fresh releases and recommendations
      # GROOVEHOUND_LISTENBRAINZ_USER: "your-listenbrainz-name"
      # GROOVEHOUND_LISTENBRAINZ_TOKEN: "..." # from https://listenbrainz.org/settings/
      # Optional: the music library mounted above
      # GROOVEHOUND_LIBRARY: /music
      # Optional: your own MusicBrainz mirror, which may allow a shorter interval
      # GROOVEHOUND_MUSICBRAINZ_API_ROOT: "http://mirror:5000"
      # GROOVEHOUND_MUSICBRAINZ_INTERVAL: "0"
