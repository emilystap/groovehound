# Groovehound configuration. Copy to config.toml (git-ignored) or mount at /config/config.toml.
# Environment variables (GROOVEHOUND_*) override these; see src/groovehound/config.py.

[database]
path = "data/groovehound.db"

[brainz]
# Required for anything that calls MusicBrainz or ListenBrainz: an email address or URL where
# their operators can reach you. Only ever sent to them, in the User-Agent.
contact = "you@example.com"

[musicbrainz]
# Your own MusicBrainz mirror (e.g. musicbrainz-docker). Empty = musicbrainz.org.
# api_root = "http://mirror:5000"
# Seconds from each response to the next request. musicbrainz.org: 1.5, never less.
# interval = 0

[listenbrainz]
# For personal fresh releases and recommendations.
# user = "your-listenbrainz-name"
# token = "..."  # https://listenbrainz.org/settings/ (optional; keep this file private)

[stores]
# The Qobuz store the wishlist's "Where to buy" search links open: the country-language part of
# its address, as in https://www.qobuz.com/gb-en/ (us-en, gb-en, fr-fr, de-de, ...).
# qobuz = "us-en"
