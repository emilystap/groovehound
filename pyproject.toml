[project]
name = "groovehound"
version = "0.1.0"
description = "A self-hosted wishlist, new-release tracker and recommender built on MusicBrainz and ListenBrainz."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
groovehound = "groovehound.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groovehound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
