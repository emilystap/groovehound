name: Image

# Builds and smoke-tests the container on every push and pull request. Publishes to GHCR from
# main (tags: latest, sha-<short>) and from version tags v1.2.3 (tags: 1.2.3, 1.2, sha-<short>).
# Docs-only changes skip the build, so merging them publishes no new image.
#
# Only the `publish` job can write to GHCR, and it never runs for a pull request.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # A job skipped by its `if` still reports its check (as skipped, which counts as passing), so
  # the required `build` check never blocks a docs-only merge. Version tags always build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.check.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          if [ "$IS_TAG" = true ]; then code=true; else code=$(bash .github/scripts/code-changed.sh "$BASE"); fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: groovehound:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The container runs without network access, so the smoke test can't reach MusicBrainz or
      # ListenBrainz even by mistake.
      - name: Smoke test (serves /healthz and the home page, as its non-root user)
        run: |
          docker run -d --name gh --network none -e GROOVEHOUND_CONTACT=ci@example.com \
            groovehound:test
          for i in $(seq 1 30); do
            if docker exec gh python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read().decode())"; then break; fi
            sleep 1
          done
          docker exec gh python -c "import urllib.request; page = urllib.request.urlopen('http://127.0.0.1:8080/', timeout=5).read().decode(); assert '<h1>Home</h1>' in page, page" \
            || { docker logs gh; exit 1; }
          docker exec gh test -f /data/groovehound.db || { docker logs gh; exit 1; }
          docker logs gh

  # Runs only once `build` has passed, so a failed smoke test publishes nothing. The layers come
  # from the cache `build` just filled.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
