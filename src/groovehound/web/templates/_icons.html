{# Line icons, drawn inline in currentColor: nothing from another site, no icon font. Beside a
   text label an icon is hidden from screen readers; alone, give it a `label`. Add an icon here
   when something first needs it. #}
{% macro icon(name, label=none) -%}
<svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
     {%- if label %} role="img" aria-label="{{ label }}"{% else %} aria-hidden="true"{% endif %}>
  {%- if name == "home" %}<path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>
  {%- elif name == "search" %}<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/>
  {%- elif name == "library" %}<path d="M5 4v16M10 4v16M14.5 4.5l5 15"/>
  {%- elif name == "bookmark" %}<path d="M6 3h12v18l-6-4-6 4z"/>
  {%- elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
  {%- elif name == "more" %}<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>
  {%- elif name == "back" %}<path d="M15 5l-7 7 7 7"/>
  {%- elif name == "forward" %}<path d="M9 5l7 7-7 7"/>
  {%- elif name == "down" %}<path d="M6 9l6 6 6-6"/>
  {%- elif name == "scan" %}<path d="M3 7a1 1 0 0 1 1-1h5l2 2.5h9a1 1 0 0 1 1 1V18a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><circle cx="11.5" cy="13.5" r="2.5"/><path d="M13.5 15.5 16 18"/>
  {%- elif name == "external" %}<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>
  {%- endif -%}
</svg>
{%- endmacro %}
